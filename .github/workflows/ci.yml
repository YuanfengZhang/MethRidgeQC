name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and test tools
        run: python -m pip install '.[test,release]'
      - name: Test source checkout
        env:
          OPENBLAS_NUM_THREADS: '1'
          POLARS_MAX_THREADS: '1'
        run: python -m pytest -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Test wheel in clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wheel-test/bin:$PATH"
          export OPENBLAS_NUM_THREADS=1 POLARS_MAX_THREADS=1
          methridgeqc --version
          methridgeqc qc --help
          methridgeqc eval --help
      - name: Build and test from sdist
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/sdist-test"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-test"
          cd "$RUNNER_TEMP"/sdist-test/*
          python -m pip install '.[test]'
          OPENBLAS_NUM_THREADS=1 POLARS_MAX_THREADS=1 python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
